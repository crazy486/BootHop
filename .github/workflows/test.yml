name: Linux checks

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux fontconfig development dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev
      # rust-toolchain.toml pins compiler 1.98.1; this action ref matches it.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      # These are the complete ordinary checks. They compile OS code but do
      # not run a desktop event loop, installed helper, firmware, or reboot.
      - name: Static dependency and fake-fixture isolation
        run: packaging/linux/check-isolation.sh
      - name: Isolation checker adversarial fixture
        run: packaging/linux/tests/isolation_checker_fake.sh
      - name: Workspace tests
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          set +e
          cargo test --workspace --locked 2>&1 | tee "$log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          cargo_status="${pipeline_status[0]:-1}"
          tee_status="${pipeline_status[1]:-1}"
          status="$cargo_status"
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status="$tee_status"
          fi
          if [ "$status" -ne 0 ]; then
            if [ -r "$log" ]; then
              tail_text="$(tail -n 80 "$log" | head -c 4000)"
              tail_text="${tail_text//%/%25}"
              tail_text="${tail_text//$'\r'/%0D}"
              tail_text="${tail_text//$'\n'/%0A}"
              tail_text="${tail_text:0:10000}"
            else
              tail_text="Unable to read workspace test log."
            fi
            echo "::error title=Workspace tests failed::$tail_text"
          fi
          exit "$status"
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fake package layout tests
        run: packaging/linux/tests/installer_fake.sh
      - name: Development package archive smoke test
        run: packaging/linux/package-smoke.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP ("boothop-workspace-tests-{0}.log" -f [guid]::NewGuid().ToString('N'))
          try {
            & cargo test --workspace --locked 2>&1 | Tee-Object -FilePath $log -ErrorAction Stop
            $status = $LASTEXITCODE
            if ($status -ne 0) {
              $tailText = (Get-Content -LiteralPath $log -Tail 80 -ErrorAction SilentlyContinue | Out-String)
              $tailText = $tailText.Substring(0, [Math]::Min(4000, $tailText.Length))
              $tailText = $tailText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              $tailText = $tailText.Substring(0, [Math]::Min(10000, $tailText.Length))
              Write-Host "::error title=Workspace tests failed::$tailText"
            }
          } finally {
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
          exit $status
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Fake Windows package tests
        shell: pwsh
        run: ./packaging/windows/tests/package_fake.ps1
      - name: Stage Windows package (non-installing)
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'boothop-windows-stage'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          & ./packaging/windows/stage.ps1 `
            -GuiPath (Join-Path $env:GITHUB_WORKSPACE 'target\release\boothop-gui.exe') `
            -HelperPath (Join-Path $env:GITHUB_WORKSPACE 'target\release\boothop-helper.exe') `
            -OutputPath $stage
          "BOOTHOP_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check Windows package
        shell: pwsh
        run: ./packaging/windows/check-package.ps1 -StagePath $env:BOOTHOP_STAGE
      - name: Audit Windows source and PE capabilities
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe is missing' }
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find '**\dumpbin.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($dumpbin) -or -not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) { throw 'dumpbin.exe is missing' }
          $gui = Join-Path $env:BOOTHOP_STAGE 'Program Files\BootHop\boothop-gui.exe'
          $helper = Join-Path $env:BOOTHOP_STAGE 'Program Files\BootHop\boothop-helper.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf) -or -not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'staged PE is missing' }
          ./packaging/windows/check-capabilities.ps1 `
            -RootPath $env:GITHUB_WORKSPACE -GuiPath $gui -HelperPath $helper -DumpbinPath $dumpbin
