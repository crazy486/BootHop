[package]
name = "boothop-windows1w-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
boothop-core = { path = "../../crates/core" }
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lib]
path = "src/lib.rs"
