[package]
name = "boothop-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
boothop-core = { path = "../core" }
boothop-protocol = { path = "../protocol" }
boothop-platform = { path = "../platform" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
serde_json = "=1.0.151"
