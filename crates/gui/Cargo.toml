[package]
name = "boothop-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
boothop-core = { path = "../core" }
boothop-protocol = { path = "../protocol" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg"] }

[build-dependencies]
# Official 1.17.1 requires its empty compatibility marker, even with implicit defaults disabled.
slint-build = { version = "=1.17.1", default-features = false, features = ["default"] }
