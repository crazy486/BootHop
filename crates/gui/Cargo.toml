[package]
name = "boothop-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
boothop-core = { path = "../core" }
boothop-protocol = { path = "../protocol" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg"] }

[build-dependencies]
# Official 1.17.1 requires its empty compatibility marker, even with implicit defaults disabled.
slint-build = { version = "=1.17.1", default-features = false, features = ["default"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
