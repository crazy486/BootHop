[package]
name = "boothop-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
boothop-core = { path = "../core" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
